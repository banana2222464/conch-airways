<script>
const airports=[{"city":"Taipei","country":"Taiwan","code":"TPE","lat":25.0797,"lon":121.2342,"hub":true},{"city":"Tainan","country":"Taiwan","code":"TNN","lat":22.9504,"lon":120.205,"hub":true},{"city":"Kaohsiung","country":"Taiwan","code":"KHH","lat":22.5771,"lon":120.35,"hub":false},{"city":"Tokyo","country":"Japan","code":"NRT","lat":35.772,"lon":140.3929,"hub":false},{"city":"Osaka","country":"Japan","code":"KIX","lat":34.4347,"lon":135.244,"hub":false},{"city":"Sapporo","country":"Japan","code":"CTS","lat":42.7752,"lon":141.6923,"hub":false},{"city":"Fukuoka","country":"Japan","code":"FUK","lat":33.5859,"lon":130.4507,"hub":false},{"city":"Seoul","country":"South Korea","code":"ICN","lat":37.4602,"lon":126.4407,"hub":false},{"city":"Busan","country":"South Korea","code":"PUS","lat":35.1796,"lon":128.9382,"hub":false},{"city":"Jeju","country":"South Korea","code":"CJU","lat":33.5113,"lon":126.493,"hub":false},{"city":"Shanghai","country":"China","code":"PVG","lat":31.1443,"lon":121.8083,"hub":false},{"city":"Nanjing","country":"China","code":"NKG","lat":31.742,"lon":118.862,"hub":false},{"city":"Shenyang","country":"China","code":"SHE","lat":41.6398,"lon":123.483,"hub":false},{"city":"Shenzhen","country":"China","code":"SZX","lat":22.6393,"lon":113.8107,"hub":false},{"city":"Beijing","country":"China","code":"PEK","lat":40.0799,"lon":116.6031,"hub":false},{"city":"Hong Kong","country":"Hong Kong","code":"HKG","lat":22.308,"lon":113.9185,"hub":false},{"city":"Manila","country":"Philippines","code":"MNL","lat":14.5086,"lon":121.0198,"hub":false},{"city":"Guam","country":"Guam","code":"GUM","lat":13.4834,"lon":144.796,"hub":false},{"city":"Bangkok","country":"Thailand","code":"BKK","lat":13.69,"lon":100.7501,"hub":false},{"city":"Ho Chi Minh City","country":"Vietnam","code":"SGN","lat":10.8188,"lon":106.652,"hub":false},{"city":"Hanoi","country":"Vietnam","code":"HAN","lat":21.2212,"lon":105.807,"hub":false},{"city":"Yangon","country":"Myanmar","code":"RGN","lat":16.9073,"lon":96.1332,"hub":false},{"city":"Vancouver","country":"Canada","code":"YVR","lat":49.1947,"lon":-123.1792,"hub":false},{"city":"Calgary","country":"Canada","code":"YYC","lat":51.1315,"lon":-114.0106,"hub":false},{"city":"Winnipeg","country":"Canada","code":"YWG","lat":49.91,"lon":-97.2399,"hub":false},{"city":"Halifax","country":"Canada","code":"YHZ","lat":44.8808,"lon":-63.5086,"hub":false},{"city":"Ottawa","country":"Canada","code":"YOW","lat":45.3225,"lon":-75.6692,"hub":false},{"city":"Montreal","country":"Canada","code":"YUL","lat":45.4706,"lon":-73.7408,"hub":false},{"city":"Hamilton","country":"Canada","code":"YHM","lat":43.1736,"lon":-79.935,"hub":false},{"city":"Toronto","country":"Canada","code":"YYZ","lat":43.6777,"lon":-79.6248,"hub":false},{"city":"New York","country":"United States","code":"JFK","lat":40.6413,"lon":-73.7781,"hub":false},{"city":"Houston","country":"United States","code":"IAH","lat":29.9902,"lon":-95.3368,"hub":false},{"city":"Denver","country":"United States","code":"DEN","lat":39.8561,"lon":-104.6737,"hub":false},{"city":"Los Angeles","country":"United States","code":"LAX","lat":33.9416,"lon":-118.4085,"hub":false},{"city":"Sacramento","country":"United States","code":"SMF","lat":38.6954,"lon":-121.5908,"hub":false},{"city":"Salt Lake City","country":"United States","code":"SLC","lat":40.7899,"lon":-111.9791,"hub":false},{"city":"Dubai","country":"United Arab Emirates","code":"DXB","lat":25.2532,"lon":55.3657,"hub":false},{"city":"New Delhi","country":"India","code":"DEL","lat":28.5562,"lon":77.1,"hub":false},{"city":"Mumbai","country":"India","code":"BOM","lat":19.0896,"lon":72.8656,"hub":false},{"city":"Jaipur","country":"India","code":"JAI","lat":26.8242,"lon":75.8122,"hub":false},{"city":"Colombo","country":"Sri Lanka","code":"CMB","lat":7.1808,"lon":79.8841,"hub":false},{"city":"Jerusalem","country":"Israel","code":"JRS","lat":31.7683,"lon":35.2137,"hub":false},{"city":"Tel Aviv","country":"Israel","code":"TLV","lat":3 const svg=document.getElementById('map');
const world=document.getElementById('world');
const routes=document.getElementById('routes');
const markers=document.getElementById('markers');
const info=document.getElementById('info');
const W=1600, H=800;
const lonMin=-180, lonMax=180, latMin=-60, latMax=85;

function xy(lon,lat){
  return [(lon-lonMin)/(lonMax-lonMin)*W,(latMax-lat)/(latMax-latMin)*H];
}
function greatCircle(a,b,steps=40){
  const lat1=a.lat*Math.PI/180, lon1=a.lon*Math.PI/180;
  const lat2=b.lat*Math.PI/180, lon2=b.lon*Math.PI/180;
  const d=2*Math.asin(Math.sqrt(
    Math.sin((lat2-lat1)/2)**2+
    Math.cos(lat1)*Math.cos(lat2)*Math.sin((lon2-lon1)/2)**2
  ));
  if(!isFinite(d)||d<.0001)return [xy(a.lon,a.lat),xy(b.lon,b.lat)];
  const out=[];
  for(let i=0;i<=steps;i++){
    const f=i/steps, A=Math.sin((1-f)*d)/Math.sin(d), B=Math.sin(f*d)/Math.sin(d);
    const x=A*Math.cos(lat1)*Math.cos(lon1)+B*Math.cos(lat2)*Math.cos(lon2);
    const y=A*Math.cos(lat1)*Math.sin(lon1)+B*Math.cos(lat2)*Math.sin(lon2);
    const z=A*Math.sin(lat1)+B*Math.sin(lat2);
    const lat=Math.atan2(z,Math.sqrt(x*x+y*y))*180/Math.PI;
    const lon=Math.atan2(y,x)*180/Math.PI;
    out.push(xy(lon,lat));
  }
  return out;
}
function pathD(points){
  return points.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
}
const byCode=Object.fromEntries(airports.map(a=>[a.code,a]));
const taipei=byCode.TPE, tainan=byCode.TNN;

airports.forEach(a=>{
  if(a.code==='TPE'||a.code==='TNN')return;
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('class','route');
  p.setAttribute('d',pathD(greatCircle(taipei,a)));
  routes.appendChild(p);
});
['KHH','HKG','MNL','BKK','SGN','HAN','CJU','PUS','NRT','KIX','PVG'].forEach(code=>{
  const a=byCode[code], p=document.createElementNS('http://www.w3.org/2000/svg','path');
  if(!a)return;
  p.setAttribute('class','route secondary');
  p.setAttribute('d',pathD(greatCircle(tainan,a)));
  routes.appendChild(p);
});

airports.forEach(a=>{
  const [x,y]=xy(a.lon,a.lat);
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','marker');
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',a.hub?6:4);
  c.setAttribute('class',a.hub?'hub':'dest');
  g.appendChild(c);

  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',x+8); t.setAttribute('y',y+4);
  t.setAttribute('class','label'); t.textContent=a.city;
  g.appendChild(t);

  g.addEventListener('click',e=>{
    e.stopPropagation();
    info.style.display='block';
    info.innerHTML='<strong>'+a.city+'</strong><br>'+a.code+' · '+a.country+(a.hub?'<br><strong>Conch Airways hub</strong>':'');
  });
  markers.appendChild(g);
});

let scale=1, tx=0, ty=0, dragging=false, sx=0, sy=0, stx=0, sty=0;
function apply(){
  world.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);
}
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width*W, my=(e.clientY-r.top)/r.height*H;
  const old=scale;
  scale=Math.max(.75,Math.min(5,scale*(e.deltaY<0?1.18:.8475)));
  tx=mx-(mx-tx)*(scale/old); ty=my-(my-ty)*(scale/old);
  apply();
},{passive:false});
svg.addEventListener('mousedown',e=>{
  dragging=true; svg.classList.add('dragging'); sx=e.clientX; sy=e.clientY; stx=tx; sty=ty;
});
window.addEventListener('mouseup',()=>{dragging=false;svg.classList.remove('dragging')});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const r=svg.getBoundingClientRect();
  tx=stx+(e.clientX-sx)/r.width*W; ty=sty+(e.clientY-sy)/r.height*H; apply();
});
svg.addEventListener('click',()=>{info.style.display='none'});
</script>
